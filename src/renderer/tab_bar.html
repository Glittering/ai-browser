<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    font-size: 12px;
    color: #ccc;
    user-select: none;
    -webkit-app-region: drag;
  }
  /* ---- 第一行：tab 条 ---- */
  #tabs-row { display: flex; align-items: stretch; height: 36px; flex: none; }
  /* 标签超过可视宽度时必须能横向滚动，否则后面的标签点不到、也关不掉。
     原来是 overflow:hidden —— 超出部分被裁掉且没有任何滚动途径，标签一多
     就等于"后半截标签永久不可用"。 */
  #tabs {
    display: flex; flex: 1; min-width: 0;
    overflow-x: auto; overflow-y: hidden;
    -webkit-app-region: no-drag;
  }
  /* 细滚动条：既提示"还有更多标签"，又不占视觉高度 */
  #tabs::-webkit-scrollbar { height: 3px; }
  #tabs::-webkit-scrollbar-track { background: transparent; }
  #tabs::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 2px; }
  #tabs::-webkit-scrollbar-thumb:hover { background: #4d4d4d; }
  .tab {
    display: flex; align-items: center;
    /* flex:none：不参与收缩。否则标签会被一路压到 min-width 再溢出，
       配合滚动后应该保持各自宽度、让容器去滚。 */
    flex: none;
    max-width: 200px; min-width: 80px; padding: 0 12px; height: 36px;
    cursor: pointer; border-right: 1px solid #2a2a2a;
    transition: background 0.15s;
    -webkit-app-region: no-drag;
  }
  .tab:hover { background: #2a2a2a; }
  .tab.active { background: #2d2d30; color: #fff; border-bottom: 2px solid #007acc; }
  .tab-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-right: 8px;
  }
  .tab-close {
    width: 16px; height: 16px; display: flex; align-items: center;
    justify-content: center; border-radius: 3px; font-size: 14px; color: #666;
    cursor: pointer; flex: none;
  }
  .tab-close:hover { background: #3a3a3a; color: #fff; }
  #new-tab {
    width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; cursor: pointer; color: #888;
    -webkit-app-region: no-drag; flex: none;
  }
  #new-tab:hover { background: #2a2a2a; color: #fff; }
  .tab-id { color: #555; font-size: 10px; margin-right: 4px; flex: none; }

  /* ---- 第二行：工具栏（地址栏 + 导航按钮）---- */
  #toolbar {
    display: flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 8px; flex: none;
    background: #202021; border-bottom: 1px solid #333;
  }
  .nav-btn {
    width: 30px; height: 26px; display: flex; align-items: center;
    justify-content: center; border: none; border-radius: 4px;
    background: transparent; color: #bbb; font-size: 14px; cursor: pointer;
    -webkit-app-region: no-drag; flex: none; padding: 0;
    font-family: inherit;
  }
  .nav-btn:hover:not(:disabled) { background: #3a3a3a; color: #fff; }
  .nav-btn:disabled { color: #4a4a4a; cursor: default; }
  #addr {
    flex: 1; min-width: 0; height: 26px;
    background: #3c3c3c; border: 1px solid #3c3c3c; border-radius: 4px;
    color: #e8e8e8; padding: 0 10px; font-size: 12px; font-family: inherit;
    -webkit-app-region: no-drag;
  }
  #addr:focus { outline: none; border-color: #007acc; background: #2d2d2d; }
  #status {
    font-size: 11px; color: #777; flex: none; max-width: 260px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #status.busy { color: #e0a33e; }
</style>
</head>
<body>
<div id="tabs-row">
  <div id="tabs"></div>
  <div id="new-tab" title="新建标签页">+</div>
</div>

<div id="toolbar">
  <button class="nav-btn" id="back"    title="后退" disabled>&#8592;</button>
  <button class="nav-btn" id="forward" title="前进" disabled>&#8594;</button>
  <button class="nav-btn" id="reload"  title="刷新">&#8635;</button>
  <button class="nav-btn" id="stop"    title="停止加载" disabled>&times;</button>
  <input id="addr" type="text" placeholder="输入网址，回车打开" spellcheck="false" autocomplete="off">
  <span id="status"></span>
</div>

<script>
// ipcRenderer 在 Electron 主窗口里才有。直接用浏览器/测试页打开本文件时
// require 会抛错——以前这会让整个 <script> 中断，连布局和滚动监听都不生效
// （UI 完全死掉）。现在降级成空操作：交互没了，但标签栏仍然看得见、滚得动。
let ipcRenderer = null;
try { ({ ipcRenderer } = require('electron')); } catch (e) { /* 非 Electron 环境 */ }
function send(ch, payload) { try { ipcRenderer.send(ch, payload); } catch (e) {} }
function invoke(ch, payload) {
  return ipcRenderer ? ipcRenderer.invoke(ch, payload) : Promise.reject(new Error('no ipc'));
}

const $ = (id) => document.getElementById(id);
const tabsEl = $('tabs'), addrEl = $('addr'), statusEl = $('status');
const backBtn = $('back'), fwdBtn = $('forward'), reloadBtn = $('reload'), stopBtn = $('stop');

// ---- tab 条（原有逻辑，保持可用）----
// 主进程通过 window.__onNavState 推送地址栏状态（push 模式）。
// 也暴露 window.__applyNavState 供本地自取（nav:state invoke 的回落）。
window.__onNavState = function (s) { applyNavState(s); };
function applyNavState(s) {
  activeTab = s.tab;
  // 地址栏只在不是用户正在输入时才更新，否则会打断打字
  if (document.activeElement !== addrEl) addrEl.value = s.url || '';
  backBtn.disabled = !s.canBack;
  fwdBtn.disabled = !s.canForward;
  reloadBtn.style.display = s.loading ? 'none' : '';
  stopBtn.style.display = s.loading ? '' : 'none';
  stopBtn.disabled = !s.loading;
  statusEl.textContent = s.status || '';
  statusEl.className = s.loading ? 'busy' : '';
  addrEl.style.borderColor = s.loading ? '#e0a33e' : '';
}

let lastIds = '';      // 上次渲染的 tab id 序列 —— 只有它变了才重建 DOM
let lastActiveId = null;

// 把指定 tab 滚进可视区（只在它确实在视区外时才动，避免无谓跳动）。
// 用 getBoundingClientRect 而不是 offsetLeft：后者依赖 offsetParent，
// 在 flex + 滚动容器里算出来的是错的值。
function scrollTabIntoView(id) {
  const el = tabsEl.querySelector('.tab[data-id="' + id + '"]');
  if (!el) return;
  const cr = tabsEl.getBoundingClientRect(), er = el.getBoundingClientRect();
  if (er.left < cr.left) tabsEl.scrollLeft -= (cr.left - er.left) + 8;
  else if (er.right > cr.right) tabsEl.scrollLeft += (er.right - cr.right) + 8;
}

async function renderTabs() {
  try {
    const tabs = await invoke('tab:list');
    const ids = tabs.map(function (t) { return t.id; }).join(',');

    if (ids !== lastIds) {
      // 结构变了（增/删 tab）：重建 DOM，但必须保住横向滚动位置 ——
      // 否则在右端关掉一个标签后视图会跳回最左，后面的标签又摸不着了。
      const prevScroll = tabsEl.scrollLeft;
      tabsEl.innerHTML = '';
      for (const tab of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.active ? ' active' : '');
        el.dataset.id = tab.id;
        el.innerHTML = '<span class="tab-id">[' + tab.id + ']</span>' +
          '<span class="tab-title">' + escapeHtml((tab.title || tab.url || 'New Tab').slice(0, 30)) + '</span>' +
          '<span class="tab-close" data-id="' + tab.id + '">&times;</span>';
        el.addEventListener('click', function (e) {
          // 从 this.dataset 取 id，不用闭包里的 tab —— 增量更新时闭包会过期。
          const id = parseInt(this.dataset.id);
          if (e.target.classList.contains('tab-close')) send('tab:close', id);
          else send('tab:activate', id);
        });
        tabsEl.appendChild(el);
      }
      lastIds = ids;
      tabsEl.scrollLeft = prevScroll;
    } else {
      // 结构没变：只改标题和激活态。绝不重建 —— 这里每 1.5s 就跑一次，
      // 一旦重建，用户刚滚到的位置就被重置，标签一多就永远滚不回去。
      for (let i = 0; i < tabs.length && i < tabsEl.children.length; i++) {
        const t = tabs[i], el = tabsEl.children[i];
        el.classList.toggle('active', !!t.active);
        const titleEl = el.querySelector('.tab-title');
        const title = (t.title || t.url || 'New Tab').slice(0, 30);
        if (titleEl && titleEl.textContent !== title) titleEl.textContent = title;
      }
    }

    // 激活的 tab 换人了（含 agent 用 browse_tabs 切的情况）就把它滚进来；
    // 已经可见时上面的计算不会产生位移。
    const active = tabs.find(function (t) { return t.active; });
    const activeId = active ? active.id : null;
    if (activeId !== null && activeId !== lastActiveId) scrollTabIntoView(activeId);
    if (activeId !== null) lastActiveId = activeId;
  } catch (e) { /* ipcRenderer 尚未就绪 */ }
}

// 横向滚动：鼠标滚轮是垂直的，标签栏要的是左右滚（浏览器惯例）。
// overflow 改成 auto 只是"能滚"，没有这一条仍然只能拖滚动条/用触控板横扫。
tabsEl.addEventListener('wheel', function (e) {
  if (tabsEl.scrollWidth <= tabsEl.clientWidth) return;
  const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (!d) return;
  tabsEl.scrollLeft += d;
  e.preventDefault();
}, { passive: false });

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- 地址栏 + 导航按钮 ----
// 所有交互都走 ipc 到主进程，由主进程操作对应 tab 的 webContents。
// 这里不直接碰页面：地址栏必须能反映**真实**状态（包括 agent 造成的导航），
// 所以显示数据全部由主进程推送，本地不缓存。
let activeTab = null;

if (ipcRenderer) ipcRenderer.on('nav:state', (_e, s) => applyNavState(s));

backBtn.addEventListener('click', () => send('nav:back'));
fwdBtn.addEventListener('click', () => send('nav:forward'));
reloadBtn.addEventListener('click', () => send('nav:reload'));
stopBtn.addEventListener('click', () => send('nav:stop'));

addrEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const v = addrEl.value.trim();
  if (!v) return;
  addrEl.blur();
  send('nav:go', v);
});
// 聚焦时全选，方便直接输入覆盖（浏览器惯例）
addrEl.addEventListener('focus', () => addrEl.select());

$('new-tab').addEventListener('click', () => send('tab:new'));

// 初始拉一次状态，然后 tab 条照旧定时刷新
invoke('nav:state').then((s) => { if (s) applyNavState(s); }).catch(() => {});
renderTabs();
setInterval(renderTabs, 1500);
</script>
</body>
</html>
