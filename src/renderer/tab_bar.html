<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    font-size: 12px;
    color: #ccc;
    user-select: none;
    -webkit-app-region: drag;
  }
  /* ---- 第一行：tab 条 ---- */
  #tabs-row { display: flex; align-items: stretch; height: 36px; flex: none; }
  /* 标签超过可视宽度时必须能横向滚动，否则后面的标签点不到、也关不掉。
     原来是 overflow:hidden —— 超出部分被裁掉且没有任何滚动途径，标签一多
     就等于"后半截标签永久不可用"。 */
  #tabs {
    display: flex; flex: 1; min-width: 0;
    overflow-x: auto; overflow-y: hidden;
    -webkit-app-region: no-drag;
  }
  /* 细滚动条：既提示"还有更多标签"，又不占视觉高度 */
  #tabs::-webkit-scrollbar { height: 3px; }
  #tabs::-webkit-scrollbar-track { background: transparent; }
  #tabs::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 2px; }
  #tabs::-webkit-scrollbar-thumb:hover { background: #4d4d4d; }
  .tab {
    display: flex; align-items: center;
    /* flex:none：不参与收缩。否则标签会被一路压到 min-width 再溢出，
       配合滚动后应该保持各自宽度、让容器去滚。 */
    flex: none;
    max-width: 200px; min-width: 80px; padding: 0 12px; height: 36px;
    cursor: pointer; border-right: 1px solid #2a2a2a;
    transition: background 0.15s;
    -webkit-app-region: no-drag;
  }
  .tab:hover { background: #2a2a2a; }
  .tab.active { background: #2d2d30; color: #fff; border-bottom: 2px solid #007acc; }
  .tab-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-right: 8px;
  }
  .tab-close {
    width: 16px; height: 16px; display: flex; align-items: center;
    justify-content: center; border-radius: 3px; font-size: 14px; color: #666;
    cursor: pointer; flex: none;
  }
  .tab-close:hover { background: #3a3a3a; color: #fff; }
  #new-tab {
    width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; cursor: pointer; color: #888;
    -webkit-app-region: no-drag; flex: none;
  }
  #new-tab:hover { background: #2a2a2a; color: #fff; }
  .tab-id { color: #555; font-size: 10px; margin-right: 4px; flex: none; }

  /* ---- agent 分组 ----
     一个 agent 的一组标签页折叠成一个 pill（带组色和页数），悬停展开。
     为什么不做成"竖着掉下来的下拉菜单"：标签栏是一个固定高度（74px）的
     BrowserView，往下弹会被自己裁掉；要能弹就得每次悬停都把标签栏长高、把页面
     往下推 —— 那正是本项目历史上闪烁/几何脱节的来源（见 SPEC 的渲染三宗罪）。
     就地展开没有这个代价：一行之内把这一组的标签摊开，鼠标移开自动收起。 */
  .group-pill {
    display: flex; align-items: center; gap: 6px; flex: none;
    height: 36px; padding: 0 10px; cursor: pointer;
    background: #232326; border-right: 1px solid #2a2a2a;
    -webkit-app-region: no-drag; max-width: 190px;
  }
  .group-pill:hover { background: #2c2c30; }
  .group-pill.open { background: #303036; }
  .g-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .g-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: #9a9a9a; max-width: 110px;
  }
  .group-pill.open .g-label { color: #e8e8e8; }
  .g-count {
    font-size: 10px; color: #999; background: #333338;
    border-radius: 8px; padding: 1px 5px; flex: none;
  }
  .g-count.full { color: #f0b46a; background: #3a2f1e; }
  /* 组内的标签：左侧一条组色，一眼看出"这页是那个 agent 的" */
  .tab.in-group { box-shadow: inset 3px 0 0 var(--g, #555); }

  /* ---- 第二行：工具栏（地址栏 + 导航按钮）---- */
  #toolbar {
    display: flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 8px; flex: none;
    background: #202021; border-bottom: 1px solid #333;
  }
  .nav-btn {
    width: 30px; height: 26px; display: flex; align-items: center;
    justify-content: center; border: none; border-radius: 4px;
    background: transparent; color: #bbb; font-size: 14px; cursor: pointer;
    -webkit-app-region: no-drag; flex: none; padding: 0;
    font-family: inherit;
  }
  .nav-btn:hover:not(:disabled) { background: #3a3a3a; color: #fff; }
  .nav-btn:disabled { color: #4a4a4a; cursor: default; }
  #addr {
    flex: 1; min-width: 0; height: 26px;
    background: #3c3c3c; border: 1px solid #3c3c3c; border-radius: 4px;
    color: #e8e8e8; padding: 0 10px; font-size: 12px; font-family: inherit;
    -webkit-app-region: no-drag;
  }
  #addr:focus { outline: none; border-color: #007acc; background: #2d2d2d; }
  #status {
    font-size: 11px; color: #777; flex: none; max-width: 260px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #status.busy { color: #e0a33e; }
  /* 「已下载 xxx」回执：页面里发起的下载（点导出、点附件）完成后出现在这里。
     没有它的年代，文件悄悄落到下载目录，界面上零回执 —— 人只能认为"没反应"。 */
  #receipt {
    display: none; align-items: center; gap: 6px;
    height: 26px; padding: 0 9px; border-radius: 4px; flex: none;
    background: #24361f; color: #a8d58c; font-size: 11px;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer; -webkit-app-region: no-drag;
  }
  #receipt.on { display: flex; }
  #receipt:hover { background: #2f4629; }
</style>
</head>
<body>
<div id="tabs-row">
  <div id="tabs"></div>
  <div id="new-tab" title="新建标签页">+</div>
</div>

<div id="toolbar">
  <button class="nav-btn" id="back"    title="后退" disabled>&#8592;</button>
  <button class="nav-btn" id="forward" title="前进" disabled>&#8594;</button>
  <button class="nav-btn" id="reload"  title="刷新">&#8635;</button>
  <button class="nav-btn" id="stop"    title="停止加载" disabled>&times;</button>
  <input id="addr" type="text" placeholder="输入网址，回车打开" spellcheck="false" autocomplete="off">
  <!-- 当前页是一份"本来会被下载、被救回来显示"的文档（图片/视频/音频/PDF）时才出现 -->
  <button class="nav-btn" id="dl" title="下载" style="display:none">&#8595;</button>
  <span id="receipt" title="点击在 Finder 中显示"></span>
  <span id="status"></span>
</div>

<script src="tab_bar_layout.js"></script>
<script>
// ipcRenderer 在 Electron 主窗口里才有。直接用浏览器/测试页打开本文件时
// require 会抛错——以前这会让整个 <script> 中断，连布局和滚动监听都不生效
// （UI 完全死掉）。现在降级成空操作：交互没了，但标签栏仍然看得见、滚得动。
let ipcRenderer = null;
try { ({ ipcRenderer } = require('electron')); } catch (e) { /* 非 Electron 环境 */ }
function send(ch, payload) { try { ipcRenderer.send(ch, payload); } catch (e) {} }
function invoke(ch, payload) {
  return ipcRenderer ? ipcRenderer.invoke(ch, payload) : Promise.reject(new Error('no ipc'));
}

const $ = (id) => document.getElementById(id);
const tabsEl = $('tabs'), addrEl = $('addr'), statusEl = $('status');
const backBtn = $('back'), fwdBtn = $('forward'), reloadBtn = $('reload'), stopBtn = $('stop');
const dlBtn = $('dl'), receiptEl = $('receipt');
const KIND_LABEL = { image: '图片', video: '视频', audio: '音频', pdf: 'PDF', file: '文件' };

// ---- tab 条（原有逻辑，保持可用）----
// 主进程通过 window.__onNavState 推送地址栏状态（push 模式）。
// 也暴露 window.__applyNavState 供本地自取（nav:state invoke 的回落）。
window.__onNavState = function (s) { applyNavState(s); };
function applyNavState(s) {
  activeTab = s.tab;
  // 地址栏只在不是用户正在输入时才更新，否则会打断打字
  if (document.activeElement !== addrEl) addrEl.value = s.url || '';
  backBtn.disabled = !s.canBack;
  fwdBtn.disabled = !s.canForward;
  reloadBtn.style.display = s.loading ? 'none' : '';
  stopBtn.style.display = s.loading ? '' : 'none';
  stopBtn.disabled = !s.loading;
  statusEl.textContent = s.status || '';
  statusEl.className = s.loading ? 'busy' : '';
  addrEl.style.borderColor = s.loading ? '#e0a33e' : '';

  // 当前页是可显示的图片/视频/PDF → 给一个「下载」入口。
  // 这类文档本来是"服务端要求下载"的，我们把它按内容类型显示了出来，
  // 所以必须同时保留"要文件"的那条路，否则等于把功能拿掉了。
  const media = s.media_doc;
  dlBtn.style.display = media ? '' : 'none';
  if (media) dlBtn.title = '下载这个' + (KIND_LABEL[media.kind] || '文件') + '（' + (media.mime || '') + '）';

  // 页面里发起的下载完成的回执（8 秒）。点一下在 Finder 中显示。
  const dl = s.download;
  receiptEl.classList.toggle('on', !!dl);
  if (dl) {
    receiptEl.textContent = '\u2193 已下载 ' + shortName(dl.name);
    receiptEl.dataset.path = dl.path || '';
    receiptEl.title = (dl.path || '') + '\n点击在 Finder 中显示';
  } else {
    receiptEl.dataset.path = '';
  }
}

/** 证书类下载的文件名常是一长串 uuid，标签位只放得下前 18 个字。 */
function shortName(name) {
  const s = String(name || '文件');
  return s.length > 18 ? s.slice(0, 12) + '…' + s.slice(-5) : s;
}

let lastSig = '';        // 上次渲染的结构签名（标签 + 分组 + 展开态）
let lastActiveId = null;
// 分组折叠状态（哪些组展开、哪些被钉住）。判据在 tab_bar_layout.js —— 纯函数，
// 由 tests/test_tab_bar_layout.js 钉住；这里只管画。
let layoutState = TabBarLayout.empty();
let currentActiveGroup = null;

// 把指定 tab 滚进可视区（只在它确实在视区外时才动，避免无谓跳动）。
// 用 getBoundingClientRect 而不是 offsetLeft：后者依赖 offsetParent，
// 在 flex + 滚动容器里算出来的是错的值。
function scrollTabIntoView(id) {
  const el = tabsEl.querySelector('.tab[data-id="' + id + '"]');
  if (!el) return;
  const cr = tabsEl.getBoundingClientRect(), er = el.getBoundingClientRect();
  if (er.left < cr.left) tabsEl.scrollLeft -= (cr.left - er.left) + 8;
  else if (er.right > cr.right) tabsEl.scrollLeft += (er.right - cr.right) + 8;
}

// 服务端会给每个组配色；万一没给（老版本），按组 id 哈希出一个稳定颜色，
// 至少保证同一组每次都是同一个色，而不是随机闪。
const FALLBACK_COLORS = ['#7c6cf0', '#3fb6a8', '#e0a33e', '#e06c75', '#5aa9e6', '#c678dd'];
function colorFor(id) {
  if (!id) return '#666';
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
}

/** 造一个标签元素。inGroup 时左侧带一条组色，表示"这页属于某个 agent"。 */
function makeTabEl(tab, groupColor) {
  const el = document.createElement('div');
  el.className = 'tab' + (tab.active ? ' active' : '') + (groupColor ? ' in-group' : '');
  el.dataset.id = tab.id;
  if (groupColor) el.style.setProperty('--g', groupColor);
  // 标题在 UI 上被截断到 30 字（标签宽度有限），完整标题 + 地址放 tooltip：
  // 否则长标题站点的标签永远看不出是哪一篇（"【第 12 章】…"全一样）。
  el.title = tabTooltip(tab);
  el.innerHTML = '<span class="tab-id">[' + tab.id + ']</span>' +
    '<span class="tab-title">' + escapeHtml((tab.title || tab.url || 'New Tab').slice(0, 30)) + '</span>' +
    '<span class="tab-close" data-id="' + tab.id + '">&times;</span>';
  return el;
}

/** 一个折叠组：组色圆点 + 名字 + 页数（满额时数字变暖色，提示该关了）。 */
function makePillEl(item) {
  const el = document.createElement('div');
  el.className = 'group-pill' + (item.open ? ' open' : '');
  el.dataset.group = item.id;   // 存**组 id**：颜色表与展开状态都以 id 为键
  el.title = 'agent 的标签组：' + item.label + '\n悬停展开，点击钉住（' +
    item.count + '/' + (item.limit || '∞') + '）';
  el.innerHTML = '<span class="g-dot" style="background:' + (item.color || colorFor(item.id)) + '"></span>' +
    '<span class="g-label">' + escapeHtml(item.label) + '</span>' +
    '<span class="g-count' + (item.limit && item.count >= item.limit ? ' full' : '') + '">' + item.count + '</span>';
  return el;
}

async function renderTabs() {
  try {
    const tabs = await invoke('tab:list');
    const view = TabBarLayout.build(tabs, layoutState);
    layoutState = view.state;
    currentActiveGroup = view.activeGroup;

    const sig = TabBarLayout.signature(tabs, view.state) + '#' + view.activeGroup;
    if (sig !== lastSig) {
      // 结构变了（增/删 tab、分组变化、展开态变化）：重建 DOM，但必须保住
      // 横向滚动位置 —— 否则在右端关掉一个标签后视图会跳回最左。
      const prevScroll = tabsEl.scrollLeft;
      tabsEl.innerHTML = '';
      for (const item of view.items) {
        if (item.type === 'group') tabsEl.appendChild(makePillEl(item));
        else tabsEl.appendChild(makeTabEl(item.tab, item.inGroup ? (item.color || colorFor(item.tab.group)) : null));
      }
      lastSig = sig;
      tabsEl.scrollLeft = prevScroll;
    } else {
      // 结构没变：只改标题和激活态。绝不重建 —— 这里每 1.5s 就跑一次，
      // 一旦重建，用户刚滚到的位置就被重置，标签一多就永远滚不回去。
      for (const t of tabs) {
        const el = tabsEl.querySelector('.tab[data-id="' + t.id + '"]');
        if (!el) continue;
        el.classList.toggle('active', !!t.active);
        const titleEl = el.querySelector('.tab-title');
        const title = (t.title || t.url || 'New Tab').slice(0, 30);
        if (titleEl && titleEl.textContent !== title) titleEl.textContent = title;
        const tip = tabTooltip(t);
        if (el.title !== tip) el.title = tip;
      }
    }

    // 激活的 tab 换人了（含 agent 用 browse_tabs 切的情况）就把它滚进来；
    // 已经可见时上面的计算不会产生位移。
    const active = tabs.find(function (t) { return t.active; });
    const activeId = active ? active.id : null;
    if (activeId !== null && activeId !== lastActiveId) scrollTabIntoView(activeId);
    if (activeId !== null) lastActiveId = activeId;
  } catch (e) { /* ipcRenderer 尚未就绪 */ }
}

// ---- 分组的交互（事件委托：标签是增量更新的，逐个挂监听重建后就会丢）----
tabsEl.addEventListener('click', function (e) {
  const pill = e.target.closest ? e.target.closest('.group-pill') : null;
  if (pill) {
    layoutState = TabBarLayout.toggle(layoutState, pill.dataset.group);
    renderTabs();
    return;
  }
  const el = e.target.closest ? e.target.closest('.tab') : null;
  if (!el || !el.dataset.id) return;
  const id = parseInt(el.dataset.id);
  if (e.target.classList.contains('tab-close')) send('tab:close', id);
  else send('tab:activate', id);
});

tabsEl.addEventListener('mouseover', function (e) {
  const pill = e.target.closest ? e.target.closest('.group-pill') : null;
  if (!pill) return;
  const g = pill.dataset.group;
  if (layoutState.expanded.indexOf(g) >= 0) return;  // 已展开：再重建会自己触发自己
  layoutState = TabBarLayout.hover(layoutState, g);
  renderTabs();
});

// 鼠标离开标签条：收起没被钉住、也不是"正在看的那一组"的组。
tabsEl.addEventListener('mouseleave', function () {
  const next = TabBarLayout.leave(layoutState, currentActiveGroup);
  if (next.expanded.join(',') === layoutState.expanded.join(',')) return;
  layoutState = next;
  renderTabs();
});

// 横向滚动：鼠标滚轮是垂直的，标签栏要的是左右滚（浏览器惯例）。
// overflow 改成 auto 只是"能滚"，没有这一条仍然只能拖滚动条/用触控板横扫。
tabsEl.addEventListener('wheel', function (e) {
  if (tabsEl.scrollWidth <= tabsEl.clientWidth) return;
  const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (!d) return;
  tabsEl.scrollLeft += d;
  e.preventDefault();
}, { passive: false });

// tab 的完整标题 + 地址，用作 tooltip。标签上只显示前 30 字，
// 长标题站点（论文/连载/同名页面）不靠 tooltip 根本分辨不出。
// 中键点击关闭标签（浏览器惯例）。用事件委托而不是给每个标签挂：
// 标签是增量更新的，逐个挂监听会在重建后丢一半。
tabsEl.addEventListener('auxclick', function (e) {
  if (e.button !== 1) return;                 // 1 = 中键
  const el = e.target && e.target.closest ? e.target.closest('.tab') : null;
  if (!el || !el.dataset.id) return;
  e.preventDefault();
  send('tab:close', parseInt(el.dataset.id));
});

function tabTooltip(t) {
  const title = String(t.title || '').trim();
  const url = String(t.url || '').trim();
  if (title && url && title !== url) return title + '\n' + url;
  return title || url || 'New Tab';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- 地址栏 + 导航按钮 ----
// 所有交互都走 ipc 到主进程，由主进程操作对应 tab 的 webContents。
// 这里不直接碰页面：地址栏必须能反映**真实**状态（包括 agent 造成的导航），
// 所以显示数据全部由主进程推送，本地不缓存。
let activeTab = null;

if (ipcRenderer) ipcRenderer.on('nav:state', (_e, s) => applyNavState(s));

backBtn.addEventListener('click', () => send('nav:back'));
fwdBtn.addEventListener('click', () => send('nav:forward'));
reloadBtn.addEventListener('click', () => send('nav:reload'));
stopBtn.addEventListener('click', () => send('nav:stop'));
dlBtn.addEventListener('click', () => send('nav:download'));
receiptEl.addEventListener('click', () => {
  const p = receiptEl.dataset.path;
  if (p) send('dl:reveal', p);
});

addrEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const v = addrEl.value.trim();
  if (!v) return;
  addrEl.blur();
  send('nav:go', v);
});
// 聚焦时全选，方便直接输入覆盖（浏览器惯例）
addrEl.addEventListener('focus', () => addrEl.select());

$('new-tab').addEventListener('click', () => send('tab:new'));

// 初始拉一次状态，然后 tab 条照旧定时刷新
invoke('nav:state').then((s) => { if (s) applyNavState(s); }).catch(() => {});
renderTabs();
setInterval(renderTabs, 1500);
</script>
</body>
</html>
