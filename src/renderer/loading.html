<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在打开…</title>
<!--
  loading.html — 新标签页的加载占位页。

  为什么需要它：新建 tab 时必须先 load 一个真实文档才能注入 window.open 垫片
  （CDP 命令在未导航的空 webContents 上无人处理会挂住），注入完成后才导航到
  真实 URL。这段间隔原本是 `about:blank` —— 也就是一片纯白。网络慢时它能持续
  几十秒（实测 GitHub OAuth 70s 才 ERR_CONNECTION_TIMED_OUT），用户和 agent
  看到的都是"弹出来一个空白页面"，无法区分"正在加载"和"开错了"。

  这个页面本身不发请求、不跑脚本，只把"正在打开哪个地址"显示出来，把白屏
  变成一个可诊断的状态。它是纯展示：真实导航由主进程在垫片注入完成后发起。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box { max-width: 560px; width: 100%; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .spinner {
    width: 14px; height: 14px; flex: none;
    border: 2px solid #3c3c3c;
    border-top-color: #569cd6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 14px; font-weight: 600; color: #d4d4d4; }
  .url {
    background: #252526; border: 1px solid #3c3c3c; border-radius: 4px;
    padding: 8px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: #9cdcfd; word-break: break-all; margin-bottom: 14px;
    min-height: 34px;
  }
  .hint { color: #858585; font-size: 12px; line-height: 1.7; }
</style>
</head>
<body>
  <div class="box">
    <div class="row">
      <div class="spinner"></div>
      <h1>正在打开…</h1>
    </div>
    <div class="url" id="u">about:blank</div>
    <div class="hint">
      新标签页需要先准备好脚本注入环境，再跳转目标地址。<br>
      长时间停在这里通常意味着目标地址连接超时（常见于被墙或缓慢的第三方登录）。
    </div>
  </div>
<script>
  // 只做展示：把目标地址从 query 里取出来显示。
  // 不发起任何请求、不做跳转 —— 真实导航由主进程发起，避免和它抢。
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      var u = q.get('url') || '';
      if (u) document.getElementById('u').textContent = u;
    } catch (e) {}
  })();
</script>
</body>
</html>
