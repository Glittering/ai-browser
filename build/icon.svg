<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    AI Browser 图标母版（build/icon.svg）

    设计意图：产品的主张不是"你会看到一个浏览器"，而是"同一个页面，agent 看到的是它背后
    那一层"。这句话不需要画成图 —— 它只需要两个面：
      ① 前面一张：你看得见的页面（宣纸 #F6F1E4）
      ② 后面一张：agent 读到的层面（金 #C9A96A）
    错开 126，后面那张只从左上透出，成一个"层"。没有线条、没有节点、没有窗口标题栏。

    为什么放弃"结构树"：三节点树不是"一个形状"，是图标库里既有的"层级"符号 ——
    任何产品都能用，等于没有标志。而且做成剪影时它会跑偏：
      细线 → sitemap 图标；加粗 → 金头 + 双肩 + 两腿的"小人"；横过来 → 插头。
    四组压力测试都掉进同一个坑，所以换成两个面。三种误读一次消失。

    两个形状意味着 16px 下的剪影只有"深色方块里一个浅色方块，左上透出一道金边"，
    不塌、不需简化版。金是唯一彩色，只给"后面那一层"—— 它指的不是装饰，是 agent 的视平面。

    尺度：两个面的并集 700（四边留白 162，约 16%），前面那张 574，错开 126（22%），
    圆角 132。错开比例低于 18% 时，那道金边会被读成描边/高光，两个面就散了。
  -->

  <!-- 满出血圆角方块：macOS 不会替图标重新裁切，形状必须自己画 -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="#1F1A13"/>

  <!-- 后面那一层（金）：先画，被前面那张压住，只在左上露出 126 宽的边 -->
  <rect x="162" y="162" width="574" height="574" rx="132" fill="#C9A96A"/>

  <!-- 前面那一层（宣纸）：整组按"两个面的并集"居中，不是单个方块居中 -->
  <rect x="288" y="288" width="574" height="574" rx="132" fill="#F6F1E4"/>
</svg>
